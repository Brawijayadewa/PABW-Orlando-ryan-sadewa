<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>List Anime, Donghua dan Manhwa</title>
</head>

<body>

    <header>
        <h1>Anime, Donghua, Manhwa</h1>

        <nav aria-label="Navigasi utama">
            <ul>
                <li><a href="#Anime">Anime</a></li>
                <li><a href="#Donghua">Donghua</a></li>
                <li><a href="#Manhwa">Manhwa</a></li>
            </ul>
        </nav>
    </header>


    <main>

        <section id="Anime">

            <h2>Koleksi Saya</h2>

            <table>
                <caption>Daftar Anime, Donghua, dan Manhwa</caption>

                <thead>
                    <tr>
                        <th scope="col">Anime</th>
                        <th scope="col">Donghua</th>
                        <th scope="col">Manhwa</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <th scope="row">One Piece</th>
                        <td>Ni Tian Zhizun</td>
                        <td>Solo Leveling</td>
                    </tr>

                    <tr>
                        <th scope="row">Naruto Shipuden</th>
                        <td>Xian Ni</td>
                        <td>Dogulwang</td>
                    </tr>

                    <tr>
                        <th scope="row">Jujutsu Kaisen</th>
                        <td>Wanmei Shijie</td>
                        <td>Tower of Gods</td>
                    </tr>
                </tbody>
            </table>


            <figure>
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTseeq3hq7Z1BBo1a2oKNkzll3rG-E-d_3prSPVHPg1eA&s=10"
                    alt="Gambar koleksi anime, donghua, dan manhwa"
                    width="640"
                    height="360"
                    loading="lazy">

                <figcaption>
                    Koleksi anime, donghua, dan manhwa
                </figcaption>
            </figure>

        </section>


        <section id="Donghua">

            <h2>Donghua saya</h2>

            <form action="/simpan" method="post">

                <p>
                    <label for="list-donghua">List Donghua:</label>
                    <input
                        type="text"
                        id="list-donghua"
                        name="list-donghua"
                        required>
                </p>

                <p>
                    <label for="list-anime">List Anime:</label>
                    <input
                        type="text"
                        id="list-anime"
                        name="list-anime"
                        required>
                </p>

                <p>
                    <label for="list-manhwa">List Manhwa:</label>
                    <input
                        type="text"
                        id="list-manhwa"
                        name="list-manhwa"
                        required>
                </p>

                <button type="submit">Simpan</button>

            </form>

        </section>

    </main>


    <footer>
        <p>Orlando Ryan Sadewa · 25523129 · 2026</p>
    </footer>

</body>

</html>
